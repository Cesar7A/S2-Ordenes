version: '3.8'

services:
  kong:
    image: kong:latest
    container_name: kong
    ports:
      - "8000:8000"    # Public Kong API Gateway
      - "8001:8001"    # Admin API
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    depends_on:
      - order-service

  order-service:
    build: .
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DB_NAME=orders
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456asd
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: orders-db
    environment:
      MYSQL_ROOT_PASSWORD: 123456asd
      MYSQL_DATABASE: orders
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
